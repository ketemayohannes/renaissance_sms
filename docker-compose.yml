services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renaissance_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=renaissance_sms
      - DB_USERNAME=school_user
      - DB_PASSWORD=school_password
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - node_modules/
            - vendor/
            - storage/
            - bootstrap/cache/

  db:
    image: mariadb:10.11
    container_name: renaissance_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=renaissance_sms
      - MYSQL_USER=school_user
      - MYSQL_PASSWORD=school_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  app_storage:
  app_cache:
