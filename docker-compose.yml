services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renaissance_app
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - app_storage:/var/www/html/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=renaissance_sms
      - DB_USERNAME=school_user
      - DB_PASSWORD=school_password
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
    depends_on:
      - db
      - valkey
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
          ignore:
            - node_modules/
            - vendor/
            - storage/
            - bootstrap/cache/

  db:
    image: mariadb:10.11
    container_name: renaissance_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=renaissance_sms
      - MYSQL_USER=school_user
      - MYSQL_PASSWORD=school_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - db_data:/var/lib/mysql

  valkey:
    image: redis:7-alpine
    container_name: renaissance_valkey
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - valkey_data:/data

volumes:
  db_data:
  app_storage:
  valkey_data:
