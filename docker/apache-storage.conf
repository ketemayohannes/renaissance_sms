# Hardening for /storage (the public disk, symlinked into public/ by `storage:link`).
# Everything under it is an uploaded file: data, never code.

<Location "/storage/">
    # Never hand an uploaded file to PHP (or any other handler), whatever its name.
    SetHandler None
    # Never let a browser guess that an uploaded file is HTML or JavaScript.
    Header always set X-Content-Type-Options "nosniff"
</Location>

# Refuse script-like files outright rather than serving their source.
<LocationMatch "(?i)^/storage/.*\.(php[0-9]?|phtml|phar|phps|pht|cgi|pl|py|sh)$">
    Require all denied
</LocationMatch>

# Private records that older versions of the app wrote to the public disk. They are only
# ever served through permission-checked controller actions, so deny them by URL until
# `php artisan storage:privatize-legacy` has moved them to the private disk.
<LocationMatch "^/storage/(employees/documents|students/documents|exports|submissions|activities)(/|$)">
    Require all denied
</LocationMatch>
