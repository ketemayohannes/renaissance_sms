[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
; apache2-foreground (from the php:apache base image) removes a stale PID file and then
; execs Apache, so Apache itself receives supervisord's stop signal. apache2ctl did
; neither: Apache was force-killed on every stop, and on a plain restart (server reboot)
; the leftover PID file could make it refuse to start ("httpd already running").
command=/usr/local/bin/apache2-foreground
; Graceful stop: let requests already in flight finish.
stopsignal=WINCH
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:laravel-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-jobs=1000 --timeout=60
directory=/var/www/html
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/worker.log
stderr_logfile=/var/log/worker-error.log
user=www-data
